services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_io
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense -d expense_io']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # MinIO a fermé l'accès anonyme à ses images officielles — LocalStack
    # (édition communautaire, S3 uniquement) est le remplaçant retenu.
    # Épinglé sur la branche 3.x : `:latest`/`:stable` exigent désormais un
    # `LOCALSTACK_AUTH_TOKEN` (licence).
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      SERVICES: s3
    ports:
      - '4567:4566'
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # Analyse de code locale, sans compte : `docker compose --profile sonar up -d sonarqube` (voir docs/sonar.md).
  # Hors du profil par défaut : `make dev` ne la démarre pas.
  sonarqube:
    image: sonarqube:community
    profiles: ['sonar']
    ports:
      - '9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
      SONAR_SEARCH_JAVAADDITIONALOPTS: '-Dcluster.routing.allocation.disk.threshold_enabled=false'
    volumes:
      - sonarqube-data:/opt/sonarqube/data

volumes:
  postgres-data:
  localstack-data:
  sonarqube-data:
