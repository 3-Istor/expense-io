# Analyse SonarQube (locale ou celle des profs) : aucun compte requis en local, voir docs/sonar.md.
sonar.projectKey=expense-io
sonar.projectName=Expense.io
sonar.sourceEncoding=UTF-8

# Code de l'application ; tests déclarés à part pour que Sonar ne les compte pas comme du code de production.
sonar.sources=src
sonar.tests=tests,src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/node_modules/**,.next/**

# Couverture produite par `npm run test:coverage` (Vitest, tests unitaires et d'intégration).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
