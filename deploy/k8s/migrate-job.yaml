apiVersion: batch/v1
kind: Job
metadata:
  name: expense-io-migrate
  labels: { app.kubernetes.io/name: expense-io, app.kubernetes.io/component: migrate }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: expense-io, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: ghcr.io/3-istor/expense-io:latest
          command: ["node", "scripts/migrate.mjs", "up"]
          env:
            - name: DATABASE_ADMIN_URL
              valueFrom: { secretKeyRef: { name: expense-io, key: DATABASE_ADMIN_URL } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
