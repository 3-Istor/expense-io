apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-io
  labels: { app.kubernetes.io/name: expense-io, app.kubernetes.io/component: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: expense-io, app.kubernetes.io/component: web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: expense-io, app.kubernetes.io/component: web }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/3-istor/expense-io:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: expense-io }
          env:
            # Uniquement les secrets utiles à l'app : pas le compte administrateur (réservé au Job de migration).
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: expense-io, key: DATABASE_URL } }
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: expense-io, key: AUTH_SECRET } }
            - name: S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: expense-io, key: S3_ENDPOINT } }
            - name: S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: expense-io, key: S3_ACCESS_KEY_ID } }
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: expense-io, key: S3_SECRET_ACCESS_KEY } }
          # Sondes sur une page existante : aucun endpoint de santé ajouté (contrat gelé).
          startupProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
            failureThreshold: 3
          # L'OCR est l'opération la plus coûteuse (bornée à 2 en parallèle par processus, SEC-11).
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
