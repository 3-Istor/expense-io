# Fichier généré par scripts/generate-openapi.ts depuis src/contract : ne pas modifier à la main.
openapi: 3.1.0
info:
  title: Expense.io API
  version: 1.2.0
  description: |
    Généré depuis src/contract (ADR 0001) : ne pas modifier à la main, lancer `npm run contract:generate`.
    Chaque réponse des tests de contrat (`tests/api/contract.spec.ts`) est validée contre ce document.
    Retirer un champ, changer un code HTTP ou une valeur d'enum exige un ADR (`docs/contract.md`).
  contact:
    name: Équipe 3-Istor
    url: https://github.com/3-Istor/expense-io
  license:
    name: Projet pédagogique ARLA
    identifier: UNLICENSED
servers:
  - url: /
    description: Même origine que l'application
security:
  - session: []
tags:
  - name: notes
    description: Notes de frais de l'utilisateur connecté
  - name: manager
    description: Validation par le manager direct
  - name: hr
    description: Validation des managers racine et annuaire RH
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Session Auth.js (JWT chiffré), obtenue par /api/auth/callback/credentials.
  schemas:
    ExpenseNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0
        expenseDate:
          type: string
          format: date
        description:
          type: string
        receiptKey:
          type: string
          description: Référence du reçu, au format d’origine ; le fichier est stocké sous une clé opaque (SEC-13)
        status:
          $ref: "#/components/schemas/ExpenseNoteStatus"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - amount
        - expenseDate
        - description
        - receiptKey
        - status
        - createdAt
      additionalProperties: false
    ExpenseNoteStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - reimbursed
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          description: Identifiant stable du type de problème
          example: urn:expense-io:problem:not-found
        title:
          type: string
          description: Résumé lisible du type de problème
        status:
          type: integer
          description: Égal au code HTTP de la réponse
        detail:
          type: string
          description: Explication propre à cette occurrence
        error:
          type: string
          description: Même texte que `detail`, gardé pour les clients du format historique
        errorId:
          type: string
          format: uuid
          description: "Erreur 500 : identifiant dans les journaux"
        stack:
          type: string
          maxLength: 0
          description: "Erreur 500 : toujours vide (SEC-07)"
      required:
        - type
        - title
        - status
        - detail
        - error
      additionalProperties: false
      description: Problem Details (RFC 9457), servi en application/problem+json sur demande.
    InternalError:
      type: object
      properties:
        error:
          type: string
        errorId:
          type: string
          format: uuid
          description: Identifiant de l'erreur dans les journaux
        stack:
          type: string
          maxLength: 0
          description: Conservé pour le contrat, toujours vide (SEC-07)
      required:
        - error
      additionalProperties: false
      description: Message générique ; le détail reste dans les journaux du serveur (SEC-07).
    ReceiptUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
        - url
      additionalProperties: false
    ReceiptSuggestion:
      type: object
      properties:
        amount:
          type: number
        expenseDate:
          type: string
          format: date
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - employee
            - manager
            - hr_admin
        managerId:
          type:
            - string
            - "null"
          format: uuid
      required:
        - id
        - name
        - email
        - role
        - managerId
      additionalProperties: false
  parameters: {}
paths:
  /api/expense-notes:
    get:
      tags:
        - notes
      operationId: listMyExpenseNotes
      summary: Liste les notes de l'appelant
      parameters:
        - schema:
            type: string
            description: Tri, `<colonne>` ou `<colonne> ASC|DESC` (insensible à la casse), colonnes created_at, amount, expense_date, status, description. Par défaut `created_at DESC`, appliqué aussi à toute autre valeur.
            example: amount DESC
          required: false
          description: Tri, `<colonne>` ou `<colonne> ASC|DESC` (insensible à la casse), colonnes created_at, amount, expense_date, status, description. Par défaut `created_at DESC`, appliqué aussi à toute autre valeur.
          name: sort
          in: query
      responses:
        "200":
          description: Notes de l'appelant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseNote"
        "401":
          description: Pas de session, ou rôle insuffisant pour les routes manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Erreur inattendue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags:
        - notes
      operationId: createExpenseNote
      summary: Crée une note avec son reçu
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  description: Nombre strictement positif, au plus 99 999 999,99
                  example: "42.50"
                expenseDate:
                  type: string
                  format: date
                  description: Date du calendrier, AAAA-MM-JJ
                  example: 2026-10-01
                description:
                  type: string
                  minLength: 1
                receipt:
                  type: string
                  contentMediaType: application/octet-stream
                  description: png, jpeg, webp ou pdf, 10 Mo au plus
              required:
                - amount
                - expenseDate
                - description
                - receipt
      responses:
        "201":
          description: Note créée, en attente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseNote"
        "400":
          description: Champs invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Pas de session, ou rôle insuffisant pour les routes manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Erreur inattendue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/expense-notes/{id}/receipt-url:
