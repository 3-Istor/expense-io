# CI de chaque PR : la moulinette au niveau pr, les tests unitaires et d'API sur une vraie base, puis l'image.
# Elle rejoue ce que l'agent a déjà lancé en local avant de commiter (hook) : la CI confirme, elle ne découvre pas.
# Chaîne d'approvisionnement (docs/security/supply-chain.md) : permissions minimales, actions épinglées par SHA
# (un tag peut être déplacé, cas Trivy de mars 2026), aucun identifiant persisté, scripts d'installation coupés
# (.npmrc), outils installés avec empreinte vérifiée, trafic sortant du runner journalisé.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs de test publiques, identiques à docker-compose.yml et à tests/support/env.ts.
  # L'app se connecte avec le compte limité créé par les migrations (SEC-05) ; l'administrateur migre et peuple.
  DATABASE_URL: postgres://expense_app_login:expense_app@localhost:5433/expense_io
  DATABASE_ADMIN_URL: postgres://expense:expense@localhost:5433/expense_io
  S3_ENDPOINT: http://localhost:4567
  S3_REGION: us-east-1
  S3_BUCKET: receipts
  S3_ACCESS_KEY_ID: test
  S3_SECRET_ACCESS_KEY: test

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_io
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U expense -d expense_io" --health-interval 5s --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: s3
        ports: ['4567:4566']
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # journalise chaque connexion sortante ; passer en « block » une fois la liste connue
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # le test T18b lit le commit d'origine 265924b
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Outils de contrôle, versions et empreintes épinglées
        run: |
          bash scripts/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Scripts d'installation coupés par .npmrc (ignore-scripts=true) : un paquet piégé ne s'exécute pas à l'install.
      - name: npm de packageManager (quarantaine de .npmrc appliquée)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - name: Dépendances
        id: deps
        run: npm ci
      # Signatures du registre et attestations de provenance des paquets installés.
      - name: Signatures des paquets
        run: npm audit signatures
      - name: Base et stockage de test
        run: |
          node scripts/migrate.mjs up
          node scripts/ensure-bucket.mjs

      - name: Moulinette (niveau pr)
        id: verify
        run: npm run verify -- --level pr
      # Le verdict devient des annotations GitHub : lisibles dans la PR ET par l'API (un agent n'a pas toujours
      # accès aux logs bruts).
      - name: Verdict de la moulinette
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          cat verify-summary.md >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const r = require("./verify-report.json");
            for (const c of r.results) {
              const kind = c.status === "fail" ? "error" : c.status === "warn" ? "warning" : c.status === "skip" ? "notice" : null;
              if (kind) console.log(`::${kind} title=${c.id} ${c.title}::${c.summary.replace(/\n/g, " ")}`);
            }'

      # Les tests tournent même si la moulinette échoue : on veut tous les signaux en un seul run.
      - name: Tests unitaires
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm test
      - name: Tests d'intégration (base réelle)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:db
      - name: Tests d'API (contrat, autorisations)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:api

      # Informatif : règles publiques du registre Semgrep, en plus des règles maison (bloquantes via S6).
      - name: Semgrep, règles du registre
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        continue-on-error: true
        run: semgrep scan --config p/typescript --config p/owasp-top-ten src --metrics=off

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verify-report
          path: |
            verify-report.json
            verify-summary.md
            test-results/
          retention-days: 14

  # L'image de production, construite et démarrée comme en production (compte PostgreSQL limité, aucun AUTH_SECRET
  # fourni), puis la suite de contrat complète lancée CONTRE ce conteneur.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_io
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U expense -d expense_io" --health-interval 5s --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: s3
        ports: ['4567:4566']
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # journalise chaque connexion sortante ; passer en « block » une fois la liste connue
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: npm de packageManager (quarantaine de .npmrc appliquée)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - name: Dépendances (scripts d'installation coupés, .npmrc)
        run: npm ci
      - name: Lint du Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - name: Construction de l'image
        run: docker build -t expense-io:ci .
      # Vulnérabilités du système de l'image (paquets Debian) et nomenclature des dépendances livrées.
      - name: Nomenclature des dépendances livrées (SBOM CycloneDX)
        run: npm sbom --omit dev --sbom-format cyclonedx > sbom.cdx.json
      # Informatif tant que l'image de base Debian porte des vulnérabilités sans correctif publié (ticket T-0012).
      - name: Analyse de l'image (OSV-Scanner)
        continue-on-error: true
        run: |
          bash scripts/install-tools.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          docker save expense-io:ci -o image.tar
          scripts/ci-run.sh "Image (OSV)" osv-scanner scan image --archive image.tar
      - name: Migrations depuis l'image (compte administrateur)
        run: docker run --rm --network host -e DATABASE_URL="$DATABASE_ADMIN_URL" expense-io:ci node scripts/migrate.mjs up
      - name: Démarrage du conteneur (compte limité, sans AUTH_SECRET)
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL -e S3_ENDPOINT -e S3_REGION -e S3_BUCKET -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY \
            -e AUTH_TRUST_HOST=true expense-io:ci
          node scripts/ensure-bucket.mjs
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: Suite de contrat contre l'image de production
        env:
          API_BASE_URL: http://localhost:3000
        run: npx playwright test tests/api/contract.spec.ts
      - name: Journaux du conteneur
        if: always()
        run: docker logs app 2>&1 | tail -50
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  # Une PR qui ajoute une dépendance vulnérable (élevée ou critique) est bloquée avant même la revue.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # journalise chaque connexion sortante ; passer en « block » une fois la liste connue
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Exige le « dependency graph » (Settings → Security) : bloquant dès qu'un administrateur l'a activé.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        continue-on-error: ${{ vars.DEPENDENCY_GRAPH_ENABLED != 'true' }}
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
