# Pose le tag `contract-vX.Y.Z` quand une nouvelle version du contrat arrive dans main (docs/contract-changelog.md).
# Le tag date la promesse faite aux clients de l'API ; la moulinette (S5) a déjà vérifié la version contre oasdiff.
name: contract-tag

on:
  push:
    branches: [main]
    paths: ['docs/openapi.yaml']

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # créer le tag, rien d'autre
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Tag de la version du contrat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version="$(sed -n 's/^  version: \(.*\)$/\1/p' docs/openapi.yaml | head -1)"
          tag="contract-v${version}"
          if gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} existe déjà."
          else
            gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="${SHA}"
            echo "Tag ${tag} posé sur ${SHA}."
          fi
