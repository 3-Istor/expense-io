# Moulinette de nuit : ce qui est trop lent pour chaque PR (mutation, fuzzing du contrat, secrets dans l'historique).
# Garder la qualité « à gauche » (Böckeler, Harness Engineering) : le rapide avant le commit, le coûteux ici.
# Mêmes protections que la CI de PR (docs/security/supply-chain.md).
name: nightly

on:
  schedule:
    - cron: '17 2 * * *' # 2 h 17 UTC, pour ne pas tomber sur l'heure pleine
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgres://expense_app_login:expense_app@localhost:5433/expense_io
  DATABASE_ADMIN_URL: postgres://expense:expense@localhost:5433/expense_io
  S3_ENDPOINT: http://localhost:4567
  S3_REGION: us-east-1
  S3_BUCKET: receipts
  S3_ACCESS_KEY_ID: test
  S3_SECRET_ACCESS_KEY: test

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_io
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U expense -d expense_io" --health-interval 5s --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: s3
        ports: ['4567:4566']
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Outils, versions et empreintes épinglées
        run: |
          bash scripts/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Dépendances
        id: deps
        run: npm ci
      - name: Base, stockage et données de démo
        run: |
          node scripts/migrate.mjs up
          node scripts/ensure-bucket.mjs
          DATABASE_URL="$DATABASE_ADMIN_URL" node scripts/seed.mjs

      - name: Moulinette (niveau nightly)
        id: verify
        run: npm run verify -- --level nightly
      - name: Tests de mutation (Stryker, seuil 95 %)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: scripts/ci-run.sh Mutation npm run test:mutation
      # Le contrat fuzzé contre le build de production, un passage par rôle (scripts/fuzz.sh).
      - name: Fuzzing du contrat (Schemathesis)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run build
          AUTH_TRUST_HOST=true npm run start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          scripts/ci-run.sh Fuzzing npm run test:fuzz -- 30
      - name: Secrets dans tout l'historique Git (informatif, SEC-02 y restera)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: gitleaks git . --no-banner --redact
      - name: Résumé
        if: ${{ !cancelled() }}
        run: cat verify-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-report
          path: |
            verify-report.json
            reports/
          retention-days: 30
