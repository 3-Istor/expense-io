# Moulinette de nuit (squelette, phase 1) : niveau nightly, puis rapport archivé.
# Les contrôles longs (ZAP, Schemathesis, Stryker, k6) s'y ajouteront en phase 4.
name: nightly

on:
  schedule:
    - cron: '17 2 * * *' # 2 h 17 UTC, pour ne pas tomber sur l'heure pleine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITLEAKS_VERSION: 8.28.0
      SEMGREP_VERSION: 1.181.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Outils
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          pip install "semgrep==${SEMGREP_VERSION}"
      - run: npm ci
      - name: Moulinette (niveau nightly)
        run: npm run verify -- --level nightly
      - name: Secrets dans tout l'historique Git (informatif, SEC-02 y restera)
        if: always()
        continue-on-error: true
        run: gitleaks git . --no-banner --redact
      - name: Résumé
        if: always()
        run: cat verify-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-report
          path: verify-report.json
          retention-days: 30
